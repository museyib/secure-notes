spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: secure-notes
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/secure_notes}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

app:
  encryption:
    secret-key: ${ENCRYPTION_SECRET_KEY:your-secret-key}
  jwt:
    issuer: ${JWT_ISSUER:policy-gate}
    secret: ${JWT_SECRET:your-base64-secret-key}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_TTL_DAYS:14}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:AdminPas123456}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Bootstrap Admin}

